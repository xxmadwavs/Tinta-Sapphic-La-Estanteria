name: Enriquecer books_data.json

on:
  workflow_dispatch:
    inputs:
      ruta_json:
        description: "Ruta del books_data.json dentro del repo"
        required: false
        default: "books_data.json"
      num_chunks:
        description: "En cuantos trozos dividir el trabajo (mas trozos = jobs mas cortos y en paralelo). Con ~1360 libros, 8-10 va sobrado para no tocar el limite de 6h por job."
        required: false
        default: "8"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.gen.outputs.chunks }}
    steps:
      - id: gen
        env:
          NUM_CHUNKS: ${{ github.event.inputs.num_chunks }}
        run: |
          python3 - <<'PY' > chunks.json
          import json, os
          n = int(os.environ["NUM_CHUNKS"])
          print(json.dumps(list(range(n))))
          PY
          echo "chunks=$(cat chunks.json)" >> "$GITHUB_OUTPUT"

  enrich:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk_index: ${{ fromJson(needs.setup.outputs.chunks) }}
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar script de enriquecimiento (chunk ${{ matrix.chunk_index }})
        run: |
          python3 enrich_books.py "${{ github.event.inputs.ruta_json }}" \
            --num-chunks "${{ github.event.inputs.num_chunks }}" \
            --chunk-index "${{ matrix.chunk_index }}"

      - name: Subir resultados de este chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk_index }}
          path: |
            books_data.cambios.chunk${{ matrix.chunk_index }}.json
            sugerencias_revisar.chunk${{ matrix.chunk_index }}.json
            enrich_log.chunk${{ matrix.chunk_index }}.txt

  merge:
    needs: [setup, enrich]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Descargar todos los chunks
        uses: actions/download-artifact@v4
        with:
          path: chunks_descargados
          pattern: chunk-*
          merge-multiple: true

      - name: Fusionar chunks sobre el JSON original
        run: python3 merge_chunks.py "${{ github.event.inputs.ruta_json }}" chunks_descargados

      - name: Subir resultado final
        uses: actions/upload-artifact@v4
        with:
          name: resultado-enriquecimiento-libros
          path: |
            books_data.actualizado.json
            sugerencias_revisar.json
            enrich_log.txt
